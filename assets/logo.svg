<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="100%" height="210" fill="none">
  <defs>
    <!-- Background: Deep Dark Green / Obsidian Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140E" />
      <stop offset="50%" stop-color="#0E2017" />
      <stop offset="100%" stop-color="#08140E" />
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224231" />
      <stop offset="50%" stop-color="#142B20" />
      <stop offset="100%" stop-color="#224231" />
    </linearGradient>

    <!-- Sunset Palette (Purple replaced with Green): Green -> Magenta -> Coral -> Yellow -->
    <linearGradient id="sunset-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="33%" stop-color="#A3138C" />
      <stop offset="66%" stop-color="#F34A51" />
      <stop offset="100%" stop-color="#FAC93C" />
    </linearGradient>

    <linearGradient id="sunset-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#A3138C" />
      <stop offset="70%" stop-color="#F34A51" />
      <stop offset="100%" stop-color="#FAC93C" />
    </linearGradient>

    <!-- Radial Glow Behind Icon -->
    <radialGradient id="radial-glow" cx="105" cy="105" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#F34A51" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#08140E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, sans-serif; }
    .title-crew { font-weight: 800; font-size: 42px; fill: #F8FAFC; letter-spacing: -0.5px; }
    .title-wright { font-weight: 800; font-size: 42px; fill: url(#sunset-title-grad); letter-spacing: -0.5px; }
    .badge-text { font-size: 10px; font-weight: 600; fill: #A7C5B5; letter-spacing: 0.8px; }
    .subtext { font-size: 13.5px; fill: #9CB8A9; font-weight: 400; }
    .code-prompt { font-size: 13px; font-weight: 600; fill: #10B981; }
    .code-cmd { font-size: 13px; font-weight: 500; fill: #F1F5F9; }
    .code-arg { font-size: 13px; font-weight: 500; fill: #FAC93C; }
    .feature-tag { font-size: 11px; font-weight: 500; fill: #E2E8F0; }
  </style>

  <!-- Container Box with Border -->
  <rect x="1.5" y="1.5" width="837" height="207" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid Pattern in Background -->
  <g opacity="0.05" stroke="#10B981" stroke-width="1">
    <line x1="20" y1="35" x2="820" y2="35" />
    <line x1="20" y1="70" x2="820" y2="70" />
    <line x1="20" y1="105" x2="820" y2="105" />
    <line x1="20" y1="140" x2="820" y2="140" />
    <line x1="20" y1="175" x2="820" y2="175" />
    <line x1="70" y1="15" x2="70" y2="195" />
    <line x1="140" y1="15" x2="140" y2="195" />
    <line x1="210" y1="15" x2="210" y2="195" />
  </g>

  <!-- Radial Glow Behind Icon -->
  <circle cx="105" cy="105" r="95" fill="url(#radial-glow)" />

  <!-- ==================== ICON: THE WRIGHT MARK ==================== -->
  <g transform="translate(10, 0)">
    <!-- Outer Hexagonal Blueprint Ring -->
    <polygon points="95,35 142,62 142,116 95,143 48,116 48,62" 
             fill="none" stroke="#142B20" stroke-width="1.5" stroke-dasharray="4 3" />
    
    <polygon points="95,41 136,65 136,113 95,137 54,113 54,65" 
             fill="#0B1A12" fill-opacity="0.7" stroke="#224231" stroke-width="1" />

    <!-- Orbital Coordination Traces -->
    <path d="M95,41 L136,113 M54,113 L95,41" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />

    <!-- Central Geometric "W" / Shipwright Keel -->
    <path d="M68,69 L78,109 L88,83 L95,97 L102,83 L112,109 L122,69" 
          fill="none" stroke="url(#sunset-icon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Architect Scaffolding Crossbar -->
    <line x1="74" y1="95" x2="116" y2="95" stroke="#F34A51" stroke-width="1.5" stroke-opacity="0.75" stroke-dasharray="2 2" />
    
    <!-- Center Terminal Prompt Symbol `>_` inside the Keel -->
    <path d="M91,113 L96,118 L91,123" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="99" y1="123" x2="104" y2="123" stroke="#FAC93C" stroke-width="2" stroke-linecap="round" />

    <!-- Specialist Sub-Agent Orbital Nodes (Sunset Swatches: Green, Magenta, Coral) -->
    <!-- Node 1: Green (Replacing Purple / Top) -->
    <circle cx="95" cy="41" r="5" fill="#0B1A12" stroke="#10B981" stroke-width="2" />
    <circle cx="95" cy="41" r="2" fill="#6EE7B7" />
    
    <!-- Node 2: Magenta Swatch (Bottom-Right) -->
    <circle cx="136" cy="113" r="5" fill="#0B1A12" stroke="#A3138C" stroke-width="2" />
    <circle cx="136" cy="113" r="2" fill="#F472B6" />

    <!-- Node 3: Coral Swatch (Bottom-Left) -->
    <circle cx="54" cy="113" r="5" fill="#0B1A12" stroke="#F34A51" stroke-width="2" />
    <circle cx="54" cy="113" r="2" fill="#FDA4AF" />

    <!-- Golden Yellow Sparkle Particles -->
    <circle cx="84" cy="61" r="1.5" fill="#FAC93C" opacity="0.9" />
    <circle cx="106" cy="61" r="1.5" fill="#10B981" opacity="0.9" />
    <circle cx="95" cy="135" r="1.5" fill="#F34A51" opacity="0.9" />
  </g>

  <!-- ==================== TYPOGRAPHY & DETAILS ==================== -->
  <g transform="translate(185, 0)">
    <!-- Top Pill: Status & Category -->
    <g transform="translate(0, 32)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#10251B" fill-opacity="0.8" stroke="#224231" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#10B981" />
      <circle cx="12" cy="11" r="6" fill="#10B981" fill-opacity="0.25" />
      <text x="24" y="15" class="mono badge-text">AGENT SKILL</text>

      <!-- Pill 2 -->
      <rect x="138" y="0" width="156" height="22" rx="11" fill="#10251B" fill-opacity="0.5" stroke="#224231" stroke-width="1" stroke-dasharray="3 2" />
      <text x="149" y="15" class="mono badge-text">MULTI-AGENT CREW</text>

      <!-- Pill 3 -->
      <rect x="302" y="0" width="156" height="22" rx="11" fill="#10251B" fill-opacity="0.5" stroke="#224231" stroke-width="1" />
      <text x="313" y="15" class="mono badge-text">SKILLS.SH READY</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 96)">
      <text class="sans">
        <tspan class="title-crew">crew-</tspan><tspan class="title-wright">wright</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="126" class="sans subtext">
      Orchestrates a team of specialist sub-agents to deliver non-trivial software tasks.
    </text>

    <!-- Bottom Interactive Install Prompt & Feature Tags -->
    <g transform="translate(0, 146)">
      <!-- Terminal Command Box -->
      <rect x="0" y="0" width="375" height="34" rx="7" fill="#060F0A" stroke="#162E22" stroke-width="1" />
      
      <!-- Traffic lights -->
      <circle cx="14" cy="17" r="3" fill="#EF4444" opacity="0.8" />
      <circle cx="23" cy="17" r="3" fill="#FAC93C" opacity="0.8" />
      <circle cx="32" cy="17" r="3" fill="#10B981" opacity="0.8" />
      
      <!-- Command text -->
      <text x="46" y="22" class="mono">
        <tspan class="code-prompt">$ </tspan>
        <tspan class="code-cmd">npx skills add </tspan>
        <tspan class="code-arg">&lt;user&gt;/crew-wright</tspan>
      </text>

      <!-- Feature Tags on the right -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="235" height="34" rx="7" fill="#0C1D14" stroke="#1C3829" stroke-width="1" />
        <text x="117" y="21" class="mono feature-tag" text-anchor="middle">
          CONTRACT • REVIEW • TESTS
        </text>
      </g>
    </g>
  </g>
</svg>
