<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="100%" height="210" fill="none">
  <defs>
    <!-- Background: Deep Carbon Black -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080B" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36304A" />
      <stop offset="50%" stop-color="#1E1A2C" />
      <stop offset="100%" stop-color="#36304A" />
    </linearGradient>

    <!-- Title & Icon Gradient: Soft Lavender -> Vibrant Spotify Green -->
    <linearGradient id="spotify-lavender-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F88F0" />
      <stop offset="45%" stop-color="#C4B5FD" />
      <stop offset="85%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#1DB954" />
    </linearGradient>

    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B72E8" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#1ED760" />
    </linearGradient>

    <!-- Dual Radial Ambience Glow: Lavender + Spotify Green -->
    <radialGradient id="radial-glow-lavender" cx="95" cy="105" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F88F0" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#8B72E8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#08080B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-glow-green" cx="440" cy="100" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1ED760" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08080B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, sans-serif; }
    .title-crew { font-weight: 800; font-size: 42px; fill: #FFFFFF; letter-spacing: -0.5px; }
    .title-wright { font-weight: 800; font-size: 42px; fill: url(#spotify-lavender-grad); letter-spacing: -0.5px; }
    .badge-text { font-size: 10px; font-weight: 600; fill: #C4B5FD; letter-spacing: 0.8px; }
    .subtext { font-size: 13.5px; fill: #A5A1B8; font-weight: 400; }
    .code-prompt { font-size: 13px; font-weight: 600; fill: #1ED760; }
    .code-cmd { font-size: 13px; font-weight: 500; fill: #F8FAFC; }
    .code-arg { font-size: 13px; font-weight: 500; fill: #C4B5FD; }
    .feature-tag { font-size: 11px; font-weight: 500; fill: #E2E8F0; }
  </style>

  <!-- Container Box with Border -->
  <rect x="1.5" y="1.5" width="837" height="207" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glow Layers -->
  <circle cx="105" cy="105" r="95" fill="url(#radial-glow-lavender)" />
  <circle cx="440" cy="100" r="140" fill="url(#radial-glow-green)" />

  <!-- Subtle Blueprint Grid Pattern in Background -->
  <g opacity="0.04" stroke="#C4B5FD" stroke-width="1">
    <line x1="20" y1="35" x2="820" y2="35" />
    <line x1="20" y1="70" x2="820" y2="70" />
    <line x1="20" y1="105" x2="820" y2="105" />
    <line x1="20" y1="140" x2="820" y2="140" />
    <line x1="20" y1="175" x2="820" y2="175" />
    <line x1="70" y1="15" x2="70" y2="195" />
    <line x1="140" y1="15" x2="140" y2="195" />
    <line x1="210" y1="15" x2="210" y2="195" />
  </g>

  <!-- ==================== ICON: THE WRIGHT MARK ==================== -->
  <g transform="translate(10, 0)">
    <!-- Outer Hexagonal Blueprint Ring -->
    <polygon points="95,35 142,62 142,116 95,143 48,116 48,62" 
             fill="none" stroke="#221C33" stroke-width="1.5" stroke-dasharray="4 3" />
    
    <polygon points="95,41 136,65 136,113 95,137 54,113 54,65" 
             fill="#0E0B17" fill-opacity="0.75" stroke="#372E50" stroke-width="1" />

    <!-- Orbital Coordination Traces -->
    <path d="M95,41 L136,113 M54,113 L95,41" stroke="#9F88F0" stroke-opacity="0.3" stroke-width="1" />

    <!-- Central Geometric "W" / Shipwright Keel -->
    <path d="M68,69 L78,109 L88,83 L95,97 L102,83 L112,109 L122,69" 
          fill="none" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Architect Scaffolding Crossbar -->
    <line x1="74" y1="95" x2="116" y2="95" stroke="#1ED760" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="2 2" />
    
    <!-- Center Terminal Prompt Symbol `>_` inside the Keel -->
    <path d="M91,113 L96,118 L91,123" fill="none" stroke="#1ED760" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="99" y1="123" x2="104" y2="123" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" />

    <!-- Specialist Sub-Agent Orbital Nodes -->
    <!-- Node 1: Top (Spotify Green) -->
    <circle cx="95" cy="41" r="5" fill="#0E0B17" stroke="#1ED760" stroke-width="2" />
    <circle cx="95" cy="41" r="2" fill="#57E785" />
    
    <!-- Node 2: Bottom-Right (Soft Lavender) -->
    <circle cx="136" cy="113" r="5" fill="#0E0B17" stroke="#9F88F0" stroke-width="2" />
    <circle cx="136" cy="113" r="2" fill="#DDD6FE" />

    <!-- Node 3: Bottom-Left (Titanium White) -->
    <circle cx="54" cy="113" r="5" fill="#0E0B17" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="54" cy="113" r="2" fill="#E2E8F0" />

    <!-- Accent Sparkle Particles -->
    <circle cx="84" cy="61" r="1.5" fill="#1ED760" opacity="0.9" />
    <circle cx="106" cy="61" r="1.5" fill="#C4B5FD" opacity="0.9" />
    <circle cx="95" cy="135" r="1.5" fill="#1ED760" opacity="0.9" />
  </g>

  <!-- ==================== TYPOGRAPHY & DETAILS ==================== -->
  <g transform="translate(185, 0)">
    <!-- Top Pill: Status & Category -->
    <g transform="translate(0, 32)">
      <!-- Pill 1: Status -->
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#171324" fill-opacity="0.85" stroke="#322B4A" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#1ED760" />
      <circle cx="12" cy="11" r="6" fill="#1ED760" fill-opacity="0.25" />
      <text x="24" y="15" class="mono badge-text">AGENT SKILL</text>

      <!-- Pill 2: Architecture -->
      <rect x="138" y="0" width="156" height="22" rx="11" fill="#171324" fill-opacity="0.5" stroke="#322B4A" stroke-width="1" stroke-dasharray="3 2" />
      <text x="149" y="15" class="mono badge-text">MULTI-AGENT CREW</text>

      <!-- Pill 3: Vercel Skills -->
      <rect x="302" y="0" width="156" height="22" rx="11" fill="#171324" fill-opacity="0.5" stroke="#322B4A" stroke-width="1" />
      <text x="313" y="15" class="mono badge-text">SKILLS.SH READY</text>
    </g>

    <!-- Main Title: White "crew-" + Lavender-to-Spotify-Green "wright" -->
    <g transform="translate(0, 96)">
      <text class="sans">
        <tspan class="title-crew">crew-</tspan><tspan class="title-wright">wright</tspan>
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="126" class="sans subtext">
      Orchestrates a team of specialist sub-agents to deliver non-trivial software tasks.
    </text>

    <!-- Bottom Interactive Install Prompt & Feature Tags -->
    <g transform="translate(0, 146)">
      <!-- Terminal Command Box in Pitch Black -->
      <rect x="0" y="0" width="375" height="34" rx="7" fill="#040407" stroke="#262038" stroke-width="1" />
      
      <!-- Traffic lights -->
      <circle cx="14" cy="17" r="3" fill="#EF4444" opacity="0.8" />
      <circle cx="23" cy="17" r="3" fill="#F59E0B" opacity="0.8" />
      <circle cx="32" cy="17" r="3" fill="#1ED760" opacity="0.8" />
      
      <!-- Command text -->
      <text x="46" y="22" class="mono">
        <tspan class="code-prompt">$ </tspan>
        <tspan class="code-cmd">npx skills add </tspan>
        <tspan class="code-arg">&lt;user&gt;/crew-wright</tspan>
      </text>

      <!-- Feature Tags on the right with Lavender outline -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="235" height="34" rx="7" fill="#0E0B17" stroke="#2B2440" stroke-width="1" />
        <text x="117" y="21" class="mono feature-tag" text-anchor="middle">
          CONTRACT • REVIEW • TESTS
        </text>
      </g>
    </g>
  </g>
</svg>
