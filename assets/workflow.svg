<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080B" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#08080B" />
    </linearGradient>

    <!-- Node Card Background -->
    <linearGradient id="step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141120" />
      <stop offset="100%" stop-color="#0B0912" />
    </linearGradient>

    <!-- Outer Border -->
    <linearGradient id="flow-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36304A" />
      <stop offset="50%" stop-color="#1E1A2C" />
      <stop offset="100%" stop-color="#36304A" />
    </linearGradient>

    <!-- Pipeline Gradients: Lavender <-> Spotify Green -->
    <linearGradient id="pipeline-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F88F0" />
      <stop offset="50%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#1ED760" />
    </linearGradient>

    <linearGradient id="pipeline-left" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1ED760" />
      <stop offset="50%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#9F88F0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, sans-serif; }
    .flow-head-tag { font-size: 10px; font-weight: 700; fill: #1ED760; letter-spacing: 1px; }
    .flow-head-title { font-size: 18px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.3px; }
    .step-num { font-size: 9.5px; font-weight: 700; fill: #1ED760; letter-spacing: 0.5px; }
    .step-title { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .step-role { font-size: 10px; fill: #A5A1B8; }
    .step-artifact { font-size: 9.5px; font-weight: 600; fill: #C4B5FD; }
  </style>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="837" height="277" rx="14" fill="url(#flow-bg)" stroke="url(#flow-border)" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(25, 18)">
    <rect x="0" y="0" width="168" height="20" rx="10" fill="#141E18" stroke="#234230" stroke-width="1" />
    <circle cx="10" cy="10" r="3" fill="#1ED760" />
    <text x="20" y="14" class="mono flow-head-tag">LIFECYCLE PIPELINE</text>
    <text x="180" y="15" class="sans flow-head-title">8-Phase Quality-Gated Delivery Flow</text>
  </g>

  <!-- ==================== TOP ROW: PHASES 0 TO 3 ==================== -->
  
  <!-- Connecting Track: Row 1 -->
  <path d="M110,88 L720,88" stroke="#251F36" stroke-width="3" />
  <path d="M110,88 L720,88" stroke="url(#pipeline-right)" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" />

  <!-- Connecting Track: Row 1 to Row 2 Curve -->
  <path d="M720,88 Q765,88 765,145 Q765,200 720,200" fill="none" stroke="#1ED760" stroke-width="2" stroke-dasharray="4 3" opacity="0.85" />

  <!-- Phase 0: Triage -->
  <g transform="translate(25, 54)">
    <rect x="0" y="0" width="170" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#1ED760" />
    <text x="26" y="20" class="mono step-num">PHASE 0</text>
    <text x="16" y="38" class="sans step-title">Triage &amp; Preset</text>
    <text x="16" y="54" class="sans step-role">Goal &#8226; Roles &#8226; Cost Est.</text>
  </g>

  <!-- Phase 1: Plan & Research -->
  <g transform="translate(215, 54)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#C4B5FD" />
    <text x="26" y="20" class="mono step-num">PHASE 1</text>
    <text x="16" y="38" class="sans step-title">Plan &amp; Research</text>
    <text x="16" y="54" class="mono step-artifact">.crew/plan.json</text>
  </g>

  <!-- Phase 2: Contract -->
  <g transform="translate(410, 54)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#1ED760" />
    <text x="26" y="20" class="mono step-num">PHASE 2</text>
    <text x="16" y="38" class="sans step-title">Interface Contract</text>
    <text x="16" y="54" class="mono step-artifact">.crew/contract.md</text>
  </g>

  <!-- Phase 3: Build Waves -->
  <g transform="translate(605, 54)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#1ED760" stroke-width="1.2" stroke-opacity="0.9" />
    <circle cx="16" cy="17" r="3.5" fill="#1ED760" />
    <text x="26" y="20" class="mono step-num">PHASE 3</text>
    <text x="16" y="38" class="sans step-title">Build in Waves</text>
    <text x="16" y="54" class="sans step-role">Parallel Coders (Disjoint)</text>
  </g>

  <!-- ==================== MIDDLE CONNECTOR & FEEDBACK ==================== -->
  <!-- Feedback Loop Track: Phase 6 (Fix) to Phase 3 (Build) -->
  <path d="M302,166 Q302,142 692,142" fill="none" stroke="#C4B5FD" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65" />
  <rect x="420" y="133" width="150" height="18" rx="9" fill="#141120" stroke="#322B4A" stroke-width="1" />
  <text x="495" y="145" class="mono" font-size="8.5" fill="#C4B5FD" text-anchor="middle">&#8635; REMEDIATION (MAX 2 ROUNDS)</text>

  <!-- ==================== BOTTOM ROW: PHASES 7 DOWN TO 4 ==================== -->

  <!-- Connecting Track: Row 2 (Right to Left) -->
  <path d="M720,200 L110,200" stroke="#251F36" stroke-width="3" />
  <path d="M720,200 L110,200" stroke="url(#pipeline-left)" stroke-width="2" stroke-dasharray="6 4" opacity="0.75" />

  <!-- Phase 4: Blind Review (Right) -->
  <g transform="translate(605, 166)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#C4B5FD" />
    <text x="26" y="20" class="mono step-num">PHASE 4</text>
    <text x="16" y="38" class="sans step-title">Blind Review</text>
    <text x="16" y="54" class="mono step-artifact">.crew/review.md</text>
  </g>

  <!-- Phase 5: Evidence Tests -->
  <g transform="translate(410, 166)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#1ED760" />
    <text x="26" y="20" class="mono step-num">PHASE 5</text>
    <text x="16" y="38" class="sans step-title">Evidence Tests</text>
    <text x="16" y="54" class="mono step-artifact">.crew/test-report.md</text>
  </g>

  <!-- Phase 6: Fix Loop -->
  <g transform="translate(215, 166)">
    <rect x="0" y="0" width="175" height="66" rx="8" fill="url(#step-bg)" stroke="#322B4A" stroke-width="1.2" />
    <circle cx="16" cy="17" r="3.5" fill="#C4B5FD" />
    <text x="26" y="20" class="mono step-num">PHASE 6</text>
    <text x="16" y="38" class="sans step-title">Triage &amp; Fix Loop</text>
    <text x="16" y="54" class="sans step-role">Targeted Remediations</text>
  </g>

  <!-- Phase 7: Gate & Deliver -->
  <g transform="translate(25, 166)">
    <rect x="0" y="0" width="170" height="66" rx="8" fill="url(#step-bg)" stroke="#1ED760" stroke-width="1.2" stroke-opacity="0.95" />
    <circle cx="16" cy="17" r="3.5" fill="#1ED760" />
    <text x="26" y="20" class="mono step-num">PHASE 7</text>
    <text x="16" y="38" class="sans step-title">Gate &amp; Deliver</text>
    <text x="16" y="54" class="sans step-role" fill="#1ED760" font-weight="600">&#10003; Verified Release</text>
  </g>

  <!-- Bottom Annotation -->
  <g transform="translate(25, 256)">
    <text class="mono" font-size="10.5" fill="#64748B">
      <tspan fill="#1ED760">&#8226;</tspan> AUDIT TRAIL IN <tspan fill="#C4B5FD">.crew/</tspan> DIRECTORY 
      &#8226; RESUMABLE ANYTIME VIA <tspan fill="#C4B5FD">.crew/state.json</tspan>
    </text>
  </g>
</svg>
