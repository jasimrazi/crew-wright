<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="icon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="keel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="icon-glow" cx="60" cy="60" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container with Rounded Corners -->
  <rect x="2" y="2" width="116" height="116" rx="24" fill="url(#icon-bg)" stroke="url(#icon-border)" stroke-width="1.5" />
  
  <!-- Subtle Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#icon-glow)" />

  <!-- Outer Hexagonal Blueprint Ring -->
  <polygon points="60,18 96,39 96,81 60,102 24,81 24,39" 
           fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <polygon points="60,24 90,41 90,79 60,96 30,79 30,41" 
           fill="#0F172A" fill-opacity="0.7" stroke="#334155" stroke-width="1" />

  <!-- Orbital Coordination Traces -->
  <path d="M60,24 L90,79 M30,79 L60,24" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />

  <!-- Central Geometric "W" / Shipwright Keel -->
  <path d="M40,46 L47,76 L54,56 L60,67 L66,56 L73,76 L80,46" 
        fill="none" stroke="url(#keel-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Drafting Compass Crossbar -->
  <line x1="44" y1="65" x2="76" y2="65" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 2" />
  
  <!-- Terminal Prompt Symbol `>_` inside the Keel -->
  <path d="M57,80 L61,84 L57,88" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="64" y1="88" x2="68" y2="88" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" />

  <!-- Specialist Sub-Agent Orbital Nodes -->
  <!-- Node 1: Planner (Top / Purple) -->
  <circle cx="60" cy="24" r="4.5" fill="#0F172A" stroke="#A855F7" stroke-width="1.8" />
  <circle cx="60" cy="24" r="1.8" fill="#C084FC" />
  
  <!-- Node 2: Coder (Bottom-Right / Cyan) -->
  <circle cx="90" cy="79" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8" />
  <circle cx="90" cy="79" r="1.8" fill="#7DD3FC" />

  <!-- Node 3: Reviewer / Tester (Bottom-Left / Emerald) -->
  <circle cx="30" cy="79" r="4.5" fill="#0F172A" stroke="#10B981" stroke-width="1.8" />
  <circle cx="30" cy="79" r="1.8" fill="#6EE7B7" />
</svg>
