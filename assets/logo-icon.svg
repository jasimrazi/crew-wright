<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background: Deep Dark Green Slate -->
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140E" />
      <stop offset="100%" stop-color="#0E2017" />
    </linearGradient>

    <linearGradient id="icon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#224231" />
      <stop offset="100%" stop-color="#142B20" />
    </linearGradient>

    <!-- Sunset Palette with Green: Green -> Magenta -> Coral -> Yellow -->
    <linearGradient id="keel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#A3138C" />
      <stop offset="70%" stop-color="#F34A51" />
      <stop offset="100%" stop-color="#FAC93C" />
    </linearGradient>

    <radialGradient id="icon-glow" cx="60" cy="60" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#F34A51" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#08140E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container with Rounded Corners -->
  <rect x="2" y="2" width="116" height="116" rx="24" fill="url(#icon-bg)" stroke="url(#icon-border)" stroke-width="1.5" />
  
  <!-- Subtle Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#icon-glow)" />

  <!-- Outer Hexagonal Blueprint Ring -->
  <polygon points="60,18 96,39 96,81 60,102 24,81 24,39" 
           fill="none" stroke="#142B20" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <polygon points="60,24 90,41 90,79 60,96 30,79 30,41" 
           fill="#0B1A12" fill-opacity="0.7" stroke="#224231" stroke-width="1" />

  <!-- Orbital Coordination Traces -->
  <path d="M60,24 L90,79 M30,79 L60,24" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />

  <!-- Central Geometric "W" / Shipwright Keel -->
  <path d="M40,46 L47,76 L54,56 L60,67 L66,56 L73,76 L80,46" 
        fill="none" stroke="url(#keel-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Drafting Compass Crossbar -->
  <line x1="44" y1="65" x2="76" y2="65" stroke="#F34A51" stroke-width="1.2" stroke-opacity="0.75" stroke-dasharray="2 2" />
  
  <!-- Terminal Prompt Symbol `>_` inside the Keel -->
  <path d="M57,80 L61,84 L57,88" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="64" y1="88" x2="68" y2="88" stroke="#FAC93C" stroke-width="1.8" stroke-linecap="round" />

  <!-- Specialist Sub-Agent Orbital Nodes -->
  <!-- Node 1: Green (Replacing Purple / Top) -->
  <circle cx="60" cy="24" r="4.5" fill="#0B1A12" stroke="#10B981" stroke-width="1.8" />
  <circle cx="60" cy="24" r="1.8" fill="#6EE7B7" />
  
  <!-- Node 2: Magenta (Bottom-Right) -->
  <circle cx="90" cy="79" r="4.5" fill="#0B1A12" stroke="#A3138C" stroke-width="1.8" />
  <circle cx="90" cy="79" r="1.8" fill="#F472B6" />

  <!-- Node 3: Coral (Bottom-Left) -->
  <circle cx="30" cy="79" r="4.5" fill="#0B1A12" stroke="#F34A51" stroke-width="1.8" />
  <circle cx="30" cy="79" r="1.8" fill="#FDA4AF" />
</svg>
